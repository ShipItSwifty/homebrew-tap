name: Update Formula (app-store-connect-mcp)

on:
  workflow_dispatch:
    inputs:
      version:
        description: app-store-connect-mcp version to publish. Leave blank for latest release.
        required: false
        default: ""
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-formula-app-store-connect-mcp
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ShipItSwifty/app-store-connect-mcp
  FORMULA_PATH: Formula/app-store-connect-mcp.rb

jobs:
  update-formula:
    name: Update Formula
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tap
        uses: actions/checkout@v7.0.1

      - name: Resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            # shellcheck disable=SC2016 # jq variables are intentionally single-quoted.
            version="$(
              gh api "repos/${UPSTREAM_REPO}/releases?per_page=100" --jq '
                [
                  .[]
                  | select(.draft == false and .prerelease == false)
                  | . as $release
                  | select(
                      any(
                        .assets[];
                        .name == ("app-store-connect-mcp-" + $release.tag_name + "-macos-universal.tar.gz")
                      )
                      and any(
                        .assets[];
                        .name == ("app-store-connect-mcp-" + $release.tag_name + "-linux-x86_64.tar.gz")
                      )
                    )
                ][0].tag_name // empty
              '
            )"

            if [ -z "$version" ]; then
              echo "::error::No upstream release has both required binary archives."
              exit 1
            fi
          fi

          current="$(ruby -e 'content = File.read(ENV.fetch("FORMULA_PATH")); puts content[%r{releases/download/([^/]+)/app-store-connect-mcp-}, 1] || ""')"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

          if [ "$version" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update formula files
        if: steps.release.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          macos_url="https://github.com/${UPSTREAM_REPO}/releases/download/$VERSION/app-store-connect-mcp-$VERSION-macos-universal.tar.gz"
          linux_url="https://github.com/${UPSTREAM_REPO}/releases/download/$VERSION/app-store-connect-mcp-$VERSION-linux-x86_64.tar.gz"

          curl -fsSL -o asc-mcp-macos.tar.gz "$macos_url"
          curl -fsSL -o asc-mcp-linux.tar.gz "$linux_url"

          export MACOS_URL="$macos_url"
          export LINUX_URL="$linux_url"
          MACOS_SHA256="$(shasum -a 256 asc-mcp-macos.tar.gz | cut -d ' ' -f 1)"
          export MACOS_SHA256
          LINUX_SHA256="$(shasum -a 256 asc-mcp-linux.tar.gz | cut -d ' ' -f 1)"
          export LINUX_SHA256

          ruby <<'RUBY'
          version    = ENV.fetch("VERSION")
          macos_sha  = ENV.fetch("MACOS_SHA256")
          linux_sha  = ENV.fetch("LINUX_SHA256")

          formula_path = ENV.fetch("FORMULA_PATH")
          formula = File.read(formula_path)

          formula.gsub!(%r{releases/download/[^/]+/app-store-connect-mcp-[^"]+-macos-universal\.tar\.gz},
                        "releases/download/#{version}/app-store-connect-mcp-#{version}-macos-universal.tar.gz")
          formula.gsub!(%r{releases/download/[^/]+/app-store-connect-mcp-[^"]+-linux-x86_64\.tar\.gz},
                        "releases/download/#{version}/app-store-connect-mcp-#{version}-linux-x86_64.tar.gz")
          formula.gsub!(/(on_macos do\n\s+url "[^"]+"\n\s+sha256 ")[^"]+/, "\\1#{macos_sha}")
          formula.gsub!(/(on_linux do\n\s+url "[^"]+"\n\s+sha256 ")[^"]+/, "\\1#{linux_sha}")

          File.write(formula_path, formula)

          readme_path = "README.md"
          readme = File.read(readme_path)
          # Anchor on the description cell so only the "Formulas" table row is
          # touched — other tables also start a row with `| `app-store-connect-mcp` |`.
          readme.gsub!(/\| `app-store-connect-mcp` \| [^|]+ \| MCP server for the App Store Connect and Xcode Cloud read API \|/,
                       "| `app-store-connect-mcp` | #{version} | MCP server for the App Store Connect and Xcode Cloud read API |")
          File.write(readme_path, readme)
          RUBY

      - name: Commit formula update
        if: steps.release.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA_PATH" README.md

          if git diff --cached --quiet; then
            echo "No formula changes to commit."
            exit 0
          fi

          git commit -m "app-store-connect-mcp $VERSION"
          git push origin HEAD:main
